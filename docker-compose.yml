services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nested:/var/www/nested
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: dev.Dockerfile
      args:
        HOST_USER_ID: 1000
        HOST_GROUP_ID: 1000
    environment:
      - APP_ENV=local
      - VITE_BASE_URL=http://localhost:5173
      - APP_URL=http://localhost
      - ASSET_URL=http://localhost
    ports:
      - "5173:5173"
    volumes:
      - ./nested:/var/www/nested
      - node_modules:/var/www/nested/node_modules:delegated
      - npm_cache:/home/www-data/.npm:delegated
    working_dir: /var/www/nested

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  pgsql:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
  node_modules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/nested/node_modules
  npm_cache:
    driver: local

networks:
  default:
    name: laravel-network