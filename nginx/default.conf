server {
    listen 80;
    listen [::]:80;
    server_name _;

    error_log  /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    root /var/www/nested/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Rota principal - redireciona / para /laravelapp
    location = / {
        return 301 /laravelapp/;
    }

    # Configuração específica para /laravelapp
    location /laravelapp {
        alias /var/www/nested/public;
        try_files $uri $uri/ @laravelapp;

        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    # Named location para handling do Laravel
    location @laravelapp {
        rewrite /laravelapp/(.*) /index.php?/$1 last;
    }

    # Protege arquivos ocultos
    location ~ /\.(?!well-known).* {
        deny all;
    }
}